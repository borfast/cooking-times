<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Timer - Plan Your Meal</title>
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="brand">
                <span class="brand-mark">🍳</span>
                <div>
                    <h1>Coordinated Cooking</h1>
                    <p class="subtitle">Plan a synchronized finish for every dish.</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="chip">Plan. Sync. Serve.</span>
            </div>
        </header>

        <main class="layout">
            <div id="planning-message" class="inline-message" role="status" hidden></div>

            <section class="food-selector panel">
                <div class="section-head">
                    <div>
                        <h2>Select foods</h2>
                        <p class="section-hint">Build the menu and choose doneness.</p>
                    </div>
                </div>
                <div id="food-list" class="stack"></div>
                <button id="add-food-btn" class="btn btn-primary btn-cta">+ Add Food</button>

                <details class="custom-food">
                    <summary>Add your own food</summary>
                    <div class="custom-food-form">
                        <input id="custom-food-name" type="text" placeholder="e.g. My roast chicken" aria-label="Food name">
                        <input id="custom-food-minutes" type="number" min="1" max="600" placeholder="min" aria-label="Cooking time in minutes">
                        <select id="custom-food-category" aria-label="Category">
                            <option value="Meat">Meat</option>
                            <option value="Fish">Fish</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Grains">Grains</option>
                            <option value="Other" selected>Other</option>
                        </select>
                        <button id="custom-food-add" type="button" class="btn btn-success">Add</button>
                    </div>
                </details>
            </section>

            <section class="schedule-display panel" id="schedule-section" style="display: none;">
                <div class="section-head">
                    <div>
                        <h2>Cooking schedule</h2>
                        <p class="section-hint">We time each start so everything finishes together.</p>
                    </div>
                </div>
                <div class="kitchen-settings">
                    <label>
                        <span>Pans or rings</span>
                        <input id="kitchen-capacity" type="number" min="1" max="12" value="4">
                    </label>
                    <label>
                        <span>Changeover</span>
                        <input id="kitchen-transition" type="number" min="0" max="15" value="0">
                        <small>min</small>
                    </label>
                    <label class="kitchen-strategy">
                        <span>If it won't all fit</span>
                        <select id="kitchen-strategy">
                            <option value="warn" selected>Just warn me</option>
                            <option value="stagger">Start things early, keep them warm</option>
                            <option value="extend">Push the finish back</option>
                        </select>
                    </label>
                </div>

                <div id="conflict-panel" class="conflict-panel" role="status" hidden></div>

                <div id="schedule-output" class="schedule-list"></div>
                <button id="start-timer-btn" class="btn btn-success btn-cta">Start Timer</button>
            </section>
        </main>
    </div>

    <script type="module" src="static/js/planning.js"></script>
</body>
</html>
