<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Timer - Execution</title>
    <link rel="stylesheet" href="static/css/styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ff6b4a">
    <link rel="icon" href="static/icons/icon-192.png" type="image/png">
    <!-- Order matters: this module must run before Alpine, which starts itself
         on execution. Deferred scripts run in document order. -->
    <script type="module" src="static/js/timer.js"></script>
    <script defer src="static/vendor/alpine-3.13.3.min.js"></script>
</head>
<body>
    <div class="container" x-data="timerApp()" x-init="init()">
        <div class="visually-hidden" aria-live="polite" aria-atomic="true" x-text="announcement"></div>
        <header class="app-header app-header--timer">
            <div class="brand">
                <span class="brand-mark">🍳</span>
                <div>
                    <h1>Cooking Timer</h1>
                    <p class="subtitle">Keep every dish on track.</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="chip chip-live" x-text="statusMessage"></span>
            </div>
        </header>

        <main class="layout layout--timer">
            <div
                x-show="message"
                x-transition
                class="inline-message"
                :class="`inline-message--${messageTone}`"
                role="status"
            >
                <span x-text="message"></span>
                <button type="button" @click="dismissMessage()" class="btn btn-small">Dismiss</button>
            </div>

            <!-- Main Timer Display -->
            <section class="timer-display panel">
                <div class="countdown" :class="{ 'alert-flash': alertActive }">
                    <div class="time-remaining">
                        <span class="time-label">Time Remaining</span>
                        <span class="time-value" aria-hidden="true" x-text="formatTime(remainingSeconds)"></span>
                        <span class="visually-hidden" x-text="`${formatTime(remainingSeconds)} remaining`"></span>
                    </div>
                    <div class="time-elapsed">
                        <span class="time-label">Elapsed</span>
                        <span class="time-value-small" aria-hidden="true" x-text="formatTime(elapsedSeconds)"></span>
                        <span class="visually-hidden" x-text="`${formatTime(elapsedSeconds)} elapsed`"></span>
                    </div>
                </div>

                <!-- Timer Controls -->
                <div class="timer-controls">
                    <template x-if="status === 'created'">
                        <button type="button" @click="start()" class="btn btn-success btn-large">
                            Start Cooking
                        </button>
                    </template>
                    <template x-if="status === 'running'">
                        <button type="button" @click="pause()" class="btn btn-warning btn-large">
                            Pause
                        </button>
                    </template>
                    <template x-if="status === 'paused'">
                        <button type="button" @click="resume()" class="btn btn-success btn-large">
                            Resume
                        </button>
                    </template>
                    <template x-if="status === 'completed'">
                        <div class="completed-message">
                            All Done! Enjoy your meal!
                        </div>
                    </template>
                    <button type="button" @click="reset()" class="btn btn-danger" x-show="status !== 'created'">
                        Reset
                    </button>
                    <a href="index.html" class="btn btn-secondary">Back to Planning</a>
                </div>
            </section>

            <!-- Alert Notification -->
            <div
                x-show="currentAlert"
                x-transition
                class="alert-popup"
                :class="alertType"
                role="alert"
                aria-live="assertive"
            >
                <div class="alert-content">
                    <strong x-text="currentAlert?.message"></strong>
                    <button type="button" @click="dismissAlert()" class="btn btn-small">Dismiss</button>
                </div>
            </div>

            <!-- Food Schedule List -->
            <section class="food-schedule panel">
                <h2>Cooking Schedule</h2>
                <template x-for="item in schedule.items" :key="item.itemId">
                    <div class="food-timer-item" :class="{
                        'cooking': isCooking(item),
                        'resting': isResting(item),
                        'waiting': isWaiting(item),
                        'done': isDone(item),
                        'editing': editingFood === item.itemId
                    }">
                        <div class="food-info">
                            <strong x-text="item.foodName"></strong>
                            <!-- A still-waiting dish can be re-cooked differently.
                                 The options come from that food, not a fixed trio. -->
                            <template x-if="isWaiting(item) && canEdit()">
                                <select
                                    class="option-edit-select"
                                    aria-label="How you want it cooked"
                                    @change="changeOption(item.itemId, $event.target.value)"
                                >
                                    <template x-for="option in optionsFor(item.itemId)" :key="option.id">
                                        <option
                                            :value="option.id"
                                            :selected="option.label === item.optionLabel"
                                            x-text="option.label"
                                        ></option>
                                    </template>
                                </select>
                            </template>
                            <template x-if="!isWaiting(item) || !canEdit()">
                                <span class="doneness" x-text="item.optionLabel"></span>
                            </template>
                        </div>
                        <div class="food-timing">
                            <template x-if="isWaiting(item)">
                                <span class="start-in">
                                    Starts in: <strong x-text="formatTime(item.startTime - elapsedSeconds)"></strong>
                                </span>
                            </template>
                            <template x-if="isCooking(item)">
                                <span class="cooking-time">
                                    <template x-if="item.restSeconds > 0">
                                        <span>Off the heat in: <strong x-text="formatTime(item.heatOffTime - elapsedSeconds)"></strong></span>
                                    </template>
                                    <template x-if="item.restSeconds === 0">
                                        <span>Done in: <strong x-text="formatTime(item.finishTime - elapsedSeconds)"></strong></span>
                                    </template>
                                </span>
                            </template>
                            <template x-if="isResting(item)">
                                <span class="resting-time">
                                    Resting, ready in <strong x-text="formatTime(item.finishTime - elapsedSeconds)"></strong>
                                </span>
                            </template>
                            <template x-if="isDone(item)">
                                <span class="done-label">Done!</span>
                            </template>
                        </div>
                        <div class="food-actions">
                            <!-- Remove button for waiting foods -->
                            <template x-if="isWaiting(item) && canEdit()">
                                <button type="button" @click="removeFood(item.itemId)" class="btn btn-danger btn-small" :aria-label="`Remove ${item.foodName}`">
                                    ✕
                                </button>
                            </template>
                            <div class="food-status-indicator" aria-hidden="true"></div>
                        </div>
                    </div>
                </template>

                <!-- Add Food Section (only when timer is running/paused) -->
                <template x-if="canEdit() && !addingFood">
                    <button type="button" @click="startAddingFood()" class="btn btn-primary add-food-timer-btn">
                        + Add Food
                    </button>
                </template>

                <!-- Add Food Form -->
                <template x-if="addingFood">
                    <div class="add-food-form">
                        <select x-model="newFoodId" @change="onNewFoodChange()" class="food-select" aria-label="Food">
                            <option value="">Select a food...</option>
                            <template x-for="food in availableFoods" :key="food.id">
                                <option :value="food.id" x-text="food.name"></option>
                            </template>
                        </select>
                        <select x-model="newFoodOptionId" class="option-select" aria-label="How you want it cooked" :disabled="!newFoodId">
                            <template x-for="option in newFoodOptions" :key="option.id">
                                <option :value="option.id" x-text="option.label"></option>
                            </template>
                        </select>
                        <button type="button" @click="addFood()" class="btn btn-success" :disabled="!newFoodId">Add</button>
                        <button type="button" @click="cancelAddFood()" class="btn btn-secondary">Cancel</button>
                    </div>
                </template>

                <div class="total-time-display">
                    <span>Total Cooking Time:</span>
                    <strong x-text="formatTime(schedule.totalTime)"></strong>
                </div>
            </section>
        </main>
    </div>

    <script>
        // G16: register the offline cache. Guarded, because the app must still
        // work in browsers without service workers -- just not offline.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((error) => {
                    console.warn('Service worker registration failed:', error);
                });
            });
        }
    </script>
</body>
</html>
